<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Validation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }
        .container {
            text-align: center;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        input {
            padding: 10px;
            width: 80%;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .message {
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Enter Card Number</h1>
        <input type="text" id="cardNumber" placeholder="Enter your card number" maxlength="16">
        <button onclick="validateCard()">Validate</button>
        <div id="message" class="message"></div>
    </div>

    <script>
        function validateCard() {
            const cardNumber = document.getElementById('cardNumber').value;
            const message = document.getElementById('message');

            if (!cardNumber) {
                message.textContent = 'Please enter a card number.';
                message.style.color = 'red';
                return;
            }

            const isValid = /^[0-9]{16}$/.test(cardNumber);

            if (isValid) {
                message.textContent = 'Card number is valid.';
                message.style.color = 'green';
            } else {
                message.textContent = 'Invalid card number. Please enter a 16-digit number.';
                message.style.color = 'red';
            }
        }
    </script>
</body>
</html>
